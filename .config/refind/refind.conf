#
# my rEFInd config
#

# theme first. nothing after the final overrides below should change timeout,
# default_selection, or showtools
include themes/catppuccin/macchiato.conf

# keep rEFInd state on the efi partition instead of uefi nvram
use_nvram false
scanfor manual,external

# nixos / systemd-boot entry. press L right as rEFInd starts to pick and boot this one

menuentry "Windows" {
    icon     /EFI/refind/themes/catppuccin/assets/macchiato/icons/os_win8.png
    volume   138ae18d-bb27-4998-9c69-7c3a3d8b2e9f
    loader   /EFI/Microsoft/Boot/bootmgfw.efi
    graphics on
}

menuentry "NixOS" {
    icon     /EFI/refind/themes/catppuccin/assets/macchiato/icons/os_nixos.png
    volume   c6520af9-4ca9-498a-987b-53f19a1dca89
    loader   /EFI/systemd/systemd-bootx64.efi
    graphics on
}

# FINAL OVERRIDES, keep these as the last active lines in the file. no key = boot
# windows, buffered L = boot nixos
timeout -1
default_selection Windows
showtools shell,reboot,shutdown,firmware,about