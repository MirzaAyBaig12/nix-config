#
# rEFInd configuration
#

# Theme first. Nothing after the final overrides below may change
# timeout, default_selection, or showtools.
#include themes/catppuccin/macchiato.conf

# Keep rEFInd state on the EFI partition rather than UEFI NVRAM.
use_nvram false
scanfor manual,external

# NixOS / systemd-boot entry. Press L immediately as rEFInd starts
# to select and boot this entry.

menuentry "Windows" {
    icon     /EFI/refind/themes/catppuccin/assets/macchiato/icons/os_win8.png
    volume   138ae18d-bb27-4998-9c69-7c3a3d8b2e9f
    loader   /EFI/Microsoft/Boot/bootmgfw.efi
    graphics on
}

menuentry "NixOS" {
    icon     /EFI/refind/themes/catppuccin/assets/macchiato/icons/os_nixos.png
    volume   c6520af9-4ca9-498a-987b-53f19a1dca89
    loader   /EFI/systemd/systemd-bootx64.efi
    graphics on
}

# FINAL OVERRIDES — keep these as the last active lines in the file.
# No key: boot Windows. Buffered L: boot NixOS.
timeout -1
default_selection Windows
showtools shell,reboot,shutdown,firmware,about